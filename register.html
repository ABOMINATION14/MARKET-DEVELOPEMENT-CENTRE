<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Development Centre | Register</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

<!-- ================= NAVBAR ================= -->
<nav>
    <a href="index.html" class="logo">
        <i class="fa-solid fa-store"></i>
        <span>Market Development<br><small>Centre</small></span>
    </a>

    <ul>
        <li><a href="index.html"><i class="fa-solid fa-house"></i> Home</a></li>
        <li><a href="products.html"><i class="fa-solid fa-basket-shopping"></i> Buy</a></li>
        <li><a href="sell.html"><i class="fa-solid fa-tag"></i> Sell</a></li>
        <li><a href="cart.html"><i class="fa-solid fa-cart-shopping"></i> Cart</a></li>
        <li><a href="login.html"><i class="fa-solid fa-user"></i> Login</a></li>
    </ul>

    <div class="icons">
        <a href="cart.html">
            <i class="fa-solid fa-cart-shopping"></i>
            <span id="cartCount">0</span>
        </a>
        <i class="fa-solid fa-bars menu-btn" onclick="toggleMenu()"></i>
    </div>
</nav>

<!-- ================= REGISTER SECTION ================= -->
<section class="auth-section">
    <div class="auth-box">
        <div class="auth-icon">
            <i class="fa-solid fa-user-plus"></i>
        </div>
        <h1>Create Account 📝</h1>
        <p>Join us to buy &amp; sell products</p>

        <form id="registerForm" onsubmit="return handleRegister(event)">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" placeholder="Enter your phone number" required>

            <label for="role">I want to</label>
            <select id="role">
                <option value="buyer">Buy Products</option>
                <option value="seller">Sell Products</option>
                <option value="both">Both Buy &amp; Sell</option>
            </select>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Create a password" required>

            <button type="submit" class="auth-btn">
                <i class="fa-solid fa-user-plus"></i> Register
            </button>
        </form>

        <p class="auth-switch">
            Already have an account?
            <a href="login.html">Login</a>
        </p>
    </div>
</section>

<!-- ================= FOOTER ================= -->
<footer>
    <div class="footer-logo">
        <i class="fa-solid fa-store"></i> Market Development Centre
    </div>
    <p>Buy &amp; Sell Fresh Products for Everyone</p>
    <p>© 2026 Market Development Centre. All Rights Reserved.</p>
    <div class="social">
        <i class="fa-brands fa-facebook"></i>
        <i class="fa-brands fa-instagram"></i>
        <i class="fa-brands fa-twitter"></i>
        <i class="fa-brands fa-whatsapp"></i>
    </div>
</footer>

<script src="script.js"></script>
<script>
function handleRegister(event){
    event.preventDefault();
    let name=document.getElementById("name").value;
    let email=document.getElementById("email").value;
    let phone=document.getElementById("phone").value;
    let role=document.getElementById("role").value;

    if(name && email && phone){
        localStorage.setItem("user",JSON.stringify({name:name, email:email, phone:phone, role:role}));
        showToast("Registration successful! Welcome " + name + " 🎉");
        setTimeout(()=>{window.location.href="index.html";},1500);
    }
    return false;
}
</script>
</body>
</html>
